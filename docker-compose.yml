services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hublead
      POSTGRES_PASSWORD: hublead
      POSTGRES_DB: hublead
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hublead -d hublead"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ATTIO_API_TOKEN: ${ATTIO_API_TOKEN}
      ATTIO_BASE_URL: ${ATTIO_BASE_URL:-https://api.attio.com}
      DATABASE_URL: postgres://hublead:hublead@db:5432/hublead?sslmode=disable
      PORT: "8080"
      ALLOWED_EXTENSION_ORIGINS: ${ALLOWED_EXTENSION_ORIGINS:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
